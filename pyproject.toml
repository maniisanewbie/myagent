[project]
name = "myagent"
version = "0.1.0"
description = "A Pydantic AI agent served behind an OpenAI-compatible chat completions API"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai==2.43.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
]

[project.scripts]
myagent = "myagent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
